name: Build Addon

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Build with Gradle
        run: |
          cd meteor-eklenti-sablonu-ana
          chmod +x gradlew
          ./gradlew build
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meteor-addon
          path: meteor-eklenti-sablonu-ana/build/libs/*.jar
