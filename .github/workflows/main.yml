name: Build Addon

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Build with Gradle
        run: |
          BUILD_DIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \;)
          cd "$BUILD_DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meteor-addon
          path: '**/build/libs/*.jar'
